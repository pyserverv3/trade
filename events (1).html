{% extends "base.html" %}
{% block title %}Manage Events — Lutan{% endblock %}
{% block content %}
<section class="page-hero"><span class="eyebrow">ADMIN</span><h1>Manage events</h1><a class="btn primary" href="{{url_for('new_event')}}">+ New event</a></section>
<section class="section admin-list">{% for event in events %}<div class="admin-row"><div><b>{{event.title}}</b><small>{{event.date}} · {{event.venue}}</small></div><div><a class="btn ghost" href="{{url_for('edit_event',event_id=event.id)}}">Edit</a><form method="post" action="{{url_for('delete_event',event_id=event.id)}}" style="display:inline"><button class="btn danger" onclick="return confirm('Delete this event?')">Delete</button></form></div></div>{% else %}<div class="empty">No events yet.</div>{% endfor %}</section>
{% endblock %}
